<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App - Brighton & Beyond</title>
  <!-- Link external CSS stylesheet -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="weather-container">
    <main class="weather-card">
      <!-- Search Form to choose a town -->
      <form id="search-form" class="search-form">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search city (e.g. Lewes, London)..."
          autocomplete="off"
          required
        >
        <button type="submit" class="btn-primary" id="search-btn">Search</button>
      </form>

      <!-- Weather Header (Town Name) -->
      <header class="weather-header">
        <h1 id="town" class="town-name">Brighton</h1>
      </header>

      <!-- Weather Graphic / Emoji -->
      <div class="weather-icon-wrapper">
        <span id="weather-icon" class="weather-emoji" aria-label="Weather icon">🌤️</span>
      </div>

      <!-- Temperature Display -->
      <div class="temperature-wrapper">
        <span id="temperature" class="temperature-value">--°C</span>
      </div>

      <!-- Weather Condition Text -->
      <div id="weather-description" class="weather-condition">Loading weather...</div>

      <!-- Details (Wind speed, Last updated) -->
      <div class="weather-details">
        <div class="detail-item">
          <span class="detail-label">Wind Speed</span>
          <span id="wind-speed" class="detail-value">-- km/h</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Last Updated</span>
          <span id="time" class="detail-value">--/--/---- --:--</span>
        </div>
      </div>

      <!-- Error box for feedback -->
      <div id="error-message" class="error-box" role="alert"></div>

      <!-- Action: Refresh data button -->
      <div class="card-actions">
        <button id="refresh-button" class="btn-refresh">
          🔄 Refresh data
        </button>
      </div>
    </main>

    <!-- Required attribution credit for Open-Meteo -->
    <footer class="attribution">
      <small>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo.com</a></small>
    </footer>
  </div>

  <!-- Link external JavaScript logic -->
  <script src="assets/js/app.js"></script>
</body>
</html>
