<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brighton Weather - Stage 3</title>
</head>
<body>
  <h1>Weather Info</h1>

  <!-- Spans to display extracted weather data -->
  <p>Town: <span id="town"></span></p>
  <p>Weather code: <span id="weather-code"></span></p>
  <p>Temperature: <span id="temperature"></span></p>
  <p>Time: <span id="time"></span></p>

  <!-- Error message container (shown if fetch fails) -->
  <p id="error-message" style="color: red;"></p>

  <!-- Required attribution credit for Open-Meteo -->
  <p><small>Weather data by Open-Meteo.com</small></p>

  <script>
    // Configuration settings for location.
    // Note: Open-Meteo does not require an API key, but if an API key were needed, this is where it would go.
    const CONFIG = {
      town: "Brighton",
      latitude: 50.8284,
      longitude: -0.1395
    };

    // Builds the Open-Meteo forecast API URL using string concatenation (+)
    function buildUrl() {
      const url = "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + CONFIG.latitude +
        "&longitude=" + CONFIG.longitude +
        "&current=temperature_2m,weather_code,wind_speed_10m" +
        "&timezone=Europe%2FLondon";
      return url;
    }

    // Displays the parsed weather values in separate spans unformatted
    function showWeather(data) {
      document.getElementById("town").textContent = CONFIG.town;
      document.getElementById("weather-code").textContent = data.current.weather_code;
      document.getElementById("temperature").textContent = data.current.temperature_2m;
      document.getElementById("time").textContent = data.current.time;
    }

    // Loads the weather data using fetch and handles errors with try and catch
    async function loadWeather() {
      const errorElement = document.getElementById("error-message");
      errorElement.textContent = "";

      try {
        const url = buildUrl();
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error("HTTP error " + response.status);
        }
        const data = await response.json();
        showWeather(data);
      } catch (error) {
        errorElement.textContent = "Could not load the weather.";
      }
    }

    // Run automatically on page load
    loadWeather();
  </script>
</body>
</html>
